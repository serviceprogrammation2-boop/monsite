services:
  - type: web
    name: monsite
    env: python
    buildCommand: |
      apt-get update
      apt-get install -y \
        libcairo2 \
        libpango-1.0-0 \
        libpangocairo-1.0-0 \
        libgdk-pixbuf-2.0-0 \
        libffi-dev \
        shared-mime-info
      pip install -r requirements.txt
    startCommand: gunicorn monsite.wsgi:application
